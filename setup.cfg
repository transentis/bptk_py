[aliases]
test=pytest

[flake8]
# The environment lives inside the repository now - uv puts it at .venv - and
# flake8's own defaults do not exclude it. The first CI run after the switch
# reported 182 undefined names, every one of them from site-packages.
# `extend-exclude` adds to flake8's defaults rather than replacing them.
extend-exclude =
    .venv,
    venv,
    venv_temp,
    build,
    dist,
    platform-dist,
    target,
    node_modules,
    docs/tutorial/_output
