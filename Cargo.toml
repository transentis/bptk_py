[package]
name = "bptk_rust_engine"
version = "0.1.0"
edition = "2021"

[lib]
name = "bptk_rust_engine"
crate-type = ["cdylib", "rlib"]

[dependencies]
pyo3 = { version = "0.29", features = ["abi3-py311"], optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
rand_distr = "0.4"
statrs = "0.17"

[features]
default = ["python", "extension-module"]
# The pyo3 binding in src/python.rs. Off, and pyo3 is not in the dependency graph.
python = ["dep:pyo3"]
# A loadable Python extension does not link libpython - the interpreter provides it.
# A test binary starts by itself and must link, which is why cargo test turns this off;
# that says nothing about whether pyo3 is compiled, hence the separate `python` feature.
extension-module = ["python", "pyo3/extension-module"]

[[test]]
name = "test_builtins"
path = "rust_tests/test_builtins.rs"

[[test]]
name = "test_eval"
path = "rust_tests/test_eval.rs"

[[test]]
name = "test_json_parser"
path = "rust_tests/test_json_parser.rs"

[[test]]
name = "test_lookup"
path = "rust_tests/test_lookup.rs"

[[test]]
name = "test_sim"
path = "rust_tests/test_sim.rs"
