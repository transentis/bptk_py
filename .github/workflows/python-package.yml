# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-linux:
    name: Test (Linux, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:13
        env:
          POSTGRES_USER: bptk
          POSTGRES_PASSWORD: bptk_test_ci
          POSTGRES_DB: bptk_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U bptk -d bptk_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping || exit 1"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11","3.12","3.13"]

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set up Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: The lock file must match pyproject.toml
      # Change a pin, forget `uv lock`, and every job below installs the previous
      # resolution without a word. This is the line that turns that into a failure.
      run: uv lock --check
    - name: Install the project and its dependencies
      # Resolved from uv.lock, so CI installs what a checkout installs rather than
      # whatever the index holds today. `--all-extras` replaces the [test] extra,
      # the `ci` group carries flake8 and pytest-cov, and `docs` is left out - the
      # library jobs do not render the website. Installing the project runs the
      # maturin build backend, which is what compiles the Rust extension.
      #
      # `--python` pins uv to the interpreter setup-python provided, so the matrix
      # still decides the version and `cargo test` links against that same one. It
      # asks Python for its own path rather than using `which`: under Git Bash on
      # Windows that yields `/c/hostedtoolcache/.../python`, and uv answered
      # "No interpreter found at path C:/hostedtoolcache/.../python" - no `.exe`.
      run: |
        uv sync --all-extras --group ci --no-group docs --python "$(python -c 'import sys; print(sys.executable)')"
    - name: Run Rust engine tests
      run: |
        cargo test --no-default-features
    - name: Lint with flake8
      run: |
        # stop the build if there are Python syntax errors or undefined names
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        # exit-zero treats all errors as warnings. The GitHub editor is 127 chars wide
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest
      env:
        ENABLE_POSTGRES_TESTS: "true"
        ENABLE_REDIS_TESTS: "true"
        POSTGRES_HOST: "localhost"
        POSTGRES_PORT: "5432"
        POSTGRES_DB: "bptk_test"
        POSTGRES_USER: "bptk"
        POSTGRES_PASSWORD: bptk_test_ci
        REDIS_URL: "redis://localhost:6379/0"
      run: |
        uv run pytest --cov-config=.coveragerc --cov=./
        uv run coverage xml
    - name: Upload coverage to Coveralls
      if: matrix.python-version == '3.11' && github.repository == 'transentis/bptk_py'
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.GITHUB_TOKEN }}
        file: coverage.xml

  test-other:
    name: Test (${{ matrix.os }}, Python ${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        python-version: ["3.11","3.12","3.13"]

    defaults:
      run:
        shell: bash

    steps:
    - uses: actions/checkout@v6
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}
    - name: Set up uv
      uses: astral-sh/setup-uv@v7
      with:
        enable-cache: true
    - name: Set up Rust toolchain
      uses: actions-rust-lang/setup-rust-toolchain@v1
    - name: The lock file must match pyproject.toml
      # Change a pin, forget `uv lock`, and every job below installs the previous
      # resolution without a word. This is the line that turns that into a failure.
      run: uv lock --check
    - name: Install the project and its dependencies
      run: |
        uv sync --all-extras --group ci --no-group docs --python "$(python -c 'import sys; print(sys.executable)')"
    - name: Run Rust engine tests
      run: |
        cargo test --no-default-features
    - name: Lint with flake8
      run: |
        uv run flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
        uv run flake8 . --count --exit-zero --max-complexity=10 --max-line-length=127 --statistics
    - name: Test with pytest (no Postgres/Redis)
      env:
        ENABLE_POSTGRES_TESTS: "false"
        ENABLE_REDIS_TESTS: "false"
      run: |
        uv run pytest

  # The browser as a fourth platform. Linux, macOS and Windows above test
  # the code on that OS against an editable install; this does the same for
  # Emscripten, where BPTK now ships a wheel. No wheel is involved: the source
  # tree is mounted into Pyodide, exactly as `pip install -e .` mounts it there.
  #
  # The Rust engine is absent by construction and tests/conftest.py handles the
  # rest - it drops what the platform cannot do (threads, subprocesses, the
  # compiled engine) and skips nothing on any other platform.
  browser:
    name: Test (Browser, Pyodide)
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v6
    - uses: actions/setup-node@v7
      with:
        node-version: '22'
    - name: Run the suite in Pyodide
      run: |
        npm install --no-save --silent pyodide@314.0.5
        node scripts/run_suite_in_pyodide.mjs .
