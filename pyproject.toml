[build-system]
requires = ["maturin>=1.7,<2.0"]
build-backend = "maturin"

[project]
name = "bptk-py"
version = "3.0.2"
# Two renderings of the same requirement, chosen by the installer rather than
# by the wheel: both wheels carry these lines and the marker decides. Pyodide
# builds pandas, numpy and scipy itself and PyPI has no wasm wheels for them,
# so an exact pin there could only fail, never bind - micropip refuses the
# install outright. Lower bounds keep the floor we tested against, and the
# browser CI job runs the whole suite against those Pyodide builds every time.
# Everything without a marker is pure Python, comes from PyPI everywhere and
# stays exact.
dependencies = [
"pandas==2.3.0; sys_platform != 'emscripten'",
"pandas>=2.3.0; sys_platform == 'emscripten'",
"scipy==1.15.3; sys_platform != 'emscripten'",
"scipy>=1.15.3; sys_platform == 'emscripten'",
"numpy==2.3.1; sys_platform != 'emscripten'",
"numpy>=2.3.1; sys_platform == 'emscripten'",
"tqdm==4.67.1",
"xlsxwriter==3.2.5",
"jsonpickle==4.1.1"
]
requires-python = ">=3.11"
authors = [
  {name = "transentis", email = "support@transentis.com"}
]
maintainers = [
  {name = "transentis", email = "support@transentis.com"}
]
description = "A python simulation engine for System Dynamics & Agent based models"
readme = "README.md"
keywords = ["system dynamics", "agent based modeling"]
classifiers = [
   "Programming Language :: Python :: 3",
       "License :: OSI Approved :: MIT License",
          "Operating System :: OS Independent"
]

[project.optional-dependencies]
# Extras are named after capabilities, not after the libraries behind them, so
# a dependency can be swapped without renaming the extra.
plotting = [
    # Pyodide ships matplotlib too - same reasoning as the base dependencies.
    "matplotlib==3.10.3; sys_platform != 'emscripten'",
    "matplotlib>=3.10.3; sys_platform == 'emscripten'"
]
xmile = [
    "parsimonious==0.10.0","xmltodict==1.0.4","jinja2==3.1.6"
]
server = [
    "flask==3.1.1","psycopg[binary,pool]==3.3.2","redis==6.4.0"
]
observability = [
    "logfire==4.19.0"
]
# The suite covers every extra, so `pip install ".[test]"` has to pull them all.
test = [
    "pytest","python-dotenv","wheel",
    "bptk-py[plotting,xmile,server,observability]"
]

[project.urls]
Homepage = "https://bptk.transentis.com"
Documentation = "https://bptk.transentis.com"
Repository = "https://github.com/transentis/bptk_py"

[tool.maturin]
python-source = "."
python-packages = ["BPTK_Py"]
module-name = "BPTK_Py._rust_engine"
features = ["pyo3/extension-module"]
bindings = "pyo3"

[tool.pytest.ini_options]
pythonpath = ["tests"]
# The documentation lives in the repository as marimo notebooks, and some of
# them are named like test modules - `model_library/beergame/test/q_table_test.py`
# is a page, not a test. Without this, collection reaches into docs/ and the
# suite dies before it starts. The other entries are pytest's own defaults,
# which naming this key would otherwise replace.
testpaths = ["tests"]
norecursedirs = ["docs", "venv", "build", "dist", "target", "node_modules", "*.egg", ".*"]
filterwarnings = [
    "ignore::DeprecationWarning:traitlets.*"
]
markers = [
    "allow_rust_fallback: test deliberately triggers the Rust-to-Python fallback",
    "requires_extra(name): test needs an optional dependency group and is skipped without it",
    "requires_rust: test needs the compiled Rust engine",
    "requires_threads: test needs to be able to start a thread",
]
